<svg viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#160828"/>
      <stop offset="100%" stop-color="#2c1350"/>
    </linearGradient>
  </defs>
  <rect width="600" height="500" fill="url(#sbg)"/>
  <!-- speaker stack -->
  <rect x="60" y="220" width="110" height="150" rx="6" fill="#0e0518" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="115" cy="260" r="28" fill="#2c1350" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="115" cy="330" r="18" fill="#2c1350" stroke="#a78bfa" stroke-width="3"/>
  <!-- mixing console -->
  <rect x="360" y="300" width="190" height="80" rx="6" fill="#0e0518" stroke="#7c3aed" stroke-width="2"/>
  <g fill="#a78bfa">
    <rect x="375" y="315" width="8" height="50"/>
    <rect x="400" y="325" width="8" height="40"/>
    <rect x="425" y="310" width="8" height="55"/>
    <rect x="450" y="330" width="8" height="35"/>
    <rect x="475" y="318" width="8" height="47"/>
    <rect x="500" y="322" width="8" height="43"/>
  </g>
  <!-- person silhouette (crew) -->
  <circle cx="260" cy="150" r="48" fill="#0e0518"/>
  <path d="M185 380 Q185 250 260 250 Q335 250 335 380 Z" fill="#160828" stroke="#7c3aed" stroke-width="2"/>
  <!-- headphones -->
  <path d="M225 130 Q260 90 295 130" stroke="#a78bfa" stroke-width="6" fill="none"/>
  <rect x="212" y="125" width="18" height="30" rx="6" fill="#a78bfa"/>
  <rect x="290" y="125" width="18" height="30" rx="6" fill="#a78bfa"/>
  <!-- cable coil -->
  <circle cx="500" cy="200" r="34" fill="none" stroke="#7c3aed" stroke-width="8"/>
</svg>
